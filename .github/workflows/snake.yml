name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # 12시간마다 갱신
  workflow_dispatch:          # 수동 실행 가능
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D8730D
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23CC7832&color_dots=%2330363d,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
